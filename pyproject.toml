[project]
name = "findex"
version = "0.4.0"
description = "Search engine for local text corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "py-spy>=0.4.3",
    "scalene>=2.4.0",
    "pytest-benchmark>=5.3.1",
    "snakeviz>=2.2.2",
]

[project.scripts]
findex = "findex.__main__:app" # Точка входу для CLI

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.3.0",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
